name: Optimize Product Images

concurrency:
  group: optimize-product-images-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "content/items/**"
      - "public/archive/items/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Optimize product images
        run: python scripts/optimize-product-images.py

      - name: Commit optimized images and updated product records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/items public/archive/optimized
          if git diff --cached --quiet; then
            echo "No new product images needed optimization."
          else
            git commit -m "Optimize product images automatically"
            git push
          fi
