name: Unpack Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/unpacked
          unzip -q black-widow-archive-final.zip -d /tmp/unpacked

          PROJECT_FILE=$(find /tmp/unpacked -name package.json -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          rsync -a --exclude='.git' "$PROJECT_DIR"/ ./

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import project files from ZIP"
          git push
