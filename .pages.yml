media:
  - name: item-images
    label: 商品图片
    input: public/archive/items
    output: /archive/items
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
    categories:
      - image

content:
  - name: items
    label: 商品资料
    type: collection
    path: content/items
    format: json
    filename: "{id}.json"
    view:
      primary: name
      fields:
        - name
        - region
        - category
        - brand
        - series
        - original_price
      sort: name
      order: asc
    fields:
      - name: id
        type: uuid
        hidden: true
        options:
          editable: false
      - name: name
        label: 商品名称
        type: string
        required: true
      - name: region
        label: 地区
        type: select
        required: true
        options:
          values:
            - 日谷
            - 美谷
            - 韩谷
            - 国谷
      - name: series_preset
        label: 系列快捷选项
        type: select
        options:
          values:
            - name: iron_man_2
              label: 钢铁侠2
            - name: avengers_1
              label: 复仇者联盟1
            - name: winter_soldier
              label: 美国队长2:冬日战士
            - name: age_of_ultron
              label: 复仇者联盟2:奥创纪元
            - name: civil_war
              label: 美国队长3:内战
            - name: infinity_war
              label: 复仇者联盟3:无限战争
            - name: endgame
              label: 复仇者联盟4:终局之战
            - name: black_widow
              label: 黑寡妇
      - name: series
        label: 其他系列（可自由填写）
        type: string
      - name: series_link_enabled
        label: 系列名称启用可点击链接
        type: boolean
      - name: set_name
        label: Set
        type: string
      - name: category
        label: 商品类别
        type: select
        required: true
        options:
          values:
            - 卡片类
            - 吧唧
            - 冰箱贴
            - 立牌类
            - 挂件类
            - 杯垫
            - 橡胶夹子
            - 文具
            - 色纸
            - 贴纸
            - 相卡
            - 明信片
            - 海报
            - 文件夹
            - 杯子
            - 毛绒
            - 手办类
            - 影音
            - 服饰
            - 其他
      - name: item_type
        label: 商品细分类
        type: string
      - name: brand_preset
        label: 品牌快捷选项
        type: select
        options:
          values:
            - name: upper_deck
              label: UPPER DECK (UD)
            - name: kakawow
              label: KAKAWOW
            - name: topps
              label: TOPPS
            - name: finding_card
              label: FINDING CARD
            - name: hot_toys
              label: HOT TOYS
            - name: marvel_legends
              label: MARVEL LEGENDS
            - name: cosbaby
              label: COSBABY
            - name: lego
              label: LEGO
            - name: pop_mart
              label: POP MART
            - name: bandai
              label: BANDAI
            - name: titan_hero_series
              label: TITAN HERO SERIES
      - name: brand
        label: 其他品牌／出版社（可自由填写）
        type: string
      - name: size
        label: 尺寸
        type: string
      - name: item_number
        label: 卡片编号
        type: string
      - name: original_price
        label: 原价
        type: string
      - name: status
        label: 默认状态
        type: select
        options:
          values:
            - name: owned
              label: 已拥有
            - name: not_owned
              label: 未拥有
            - name: wishlist
              label: 愿望单
      - name: person_count
        label: 人物数量
        type: select
        options:
          values:
            - name: single
              label: 单人
            - name: multi
              label: 多人
            - name: other
              label: 其他
      - name: character_preset
        label: 人物快捷选项
        type: select
        options:
          values:
            - name: natasha_romanoff
              label: 娜塔莎·罗曼诺夫
      - name: characters
        label: 其他人物（可自由填写）
        type: string
      - name: keywords
        label: 搜索关键词
        type: string
      - name: notes_preset
        label: 备注快捷选项
        type: select
        options:
          values:
            - name: blind_draw
              label: 盲抽
            - name: set
              label: 套装
      - name: notes
        label: 其他备注（可自由填写）
        type: text
      - name: images
        label: 商品图片
        type: image
        options:
          media: item-images
          multiple:
            max: 10
